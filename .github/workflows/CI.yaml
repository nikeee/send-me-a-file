name: CI

on: push

jobs:
  build:

    runs-on: ubuntu-slim

    strategy:
      matrix:
        node-version: [latest]

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm

    - name: npm install, build, and test
      run: |
        npm ci
        npm run compile --if-present
        npm test
      env:
        CI: true
